name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create test application.properties
        run: |
          cat > src/main/resources/application.properties <<'EOF'
          spring.application.name=next_campus
          spring.jpa.hibernate.ddl-auto=validate

          jwt.secret=kojJ1TPzps0fwu4W8gvAuQUWxr9tLKzLS/qDGlAP4Axl5po0wpQEOkRkQOVrf6UGAMT30PvpjZR1HuxvHRUn3Q==
          jwt.issuer=ci-test
          jwt.access-token-expiration-ms=900000
          jwt.refresh-token-expiration-ms=1209600000

          fcm.firebase.config.path=none
          fcm.firebase.storage-bucket=ci-test-bucket

          spring.mail.host=smtp.gmail.com
          spring.mail.port=587
          spring.mail.username=ci-test@example.com
          spring.mail.password=ci-test-dummy

          server.port=8080

          spring.flyway.locations=filesystem:db/postgres/migration
          
          spring.data.redis.repositories.enabled=false
          EOF

      - name: Run tests
        run: chmod +x gradlew && ./gradlew test --no-daemon
